[project]
name = "abhd"
version = "0.1.0"
description = "Structure-based exploration of the alpha/beta-hydrolase superfamily (CATH 3.40.50.1820)"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "biopython",
  "requests",
  "umap-learn",
  "matplotlib",
  "plotly",
  "ase",
  "dscribe",
  "jupyter",
  "nbconvert",
  "ipykernel",
  "nbformat",
  "tmtools>=0.3.0",
  "molviewspec>=1.8.1",
]

[project.optional-dependencies]
# Only needed to (re)compute ProtBert embeddings (stage 3); torch is large.
embed = ["torch", "transformers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abhd"]
